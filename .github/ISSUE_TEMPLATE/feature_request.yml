name: 💡 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先搜索现有 Issue；较大的功能会先在 Issue 中讨论方案，确认后再实现。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明痛点、业务场景或当前实现的不足
      placeholder: 例如：重分开错人后没有留痕，无法追溯当时原因
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你希望看到的交互、接口或数据模型变化
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 后端 API
        - 平台用户界面
        - CPHOS 成员界面
        - 管理员界面
        - 共享 schema / DTO
        - 部署与运维
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 原型、参考实现、相关 Issue 或设计文档链接
    validations:
      required: false
